<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitra — Autonomous Trading Bot</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #141420;
    --border: #1e1e30;
    --text: #e0e0e0;
    --muted: #8888a0;
    --green: #00d4aa;
    --red: #ff4d6a;
    --blue: #4d9fff;
    --gold: #f0b90b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; padding: 16px;
  }
  .container { max-width: 960px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap; gap: 8px;
  }
  header h1 { font-size: 22px; font-weight: 700; }
  header .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  header .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  header .dot.off { background: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 700; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); }

  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .periods { display: flex; gap: 4px; }
  .periods button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .periods button.active { background: var(--green); color: #000; border-color: var(--green); font-weight: 600; }
  .periods button:hover { border-color: var(--text); color: var(--text); }
  canvas { width: 100%; height: 280px; }
  .chart-legend { display: flex; gap: 20px; margin-top: 8px; font-size: 12px; }
  .chart-legend span { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 3px; border-radius: 2px; }

  h2 { font-size: 15px; margin-bottom: 10px; }
  .table-wrap { overflow-x: auto; margin-bottom: 20px; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 8px; font-size: 13px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td.symbol { font-weight: 700; }
  tr:hover td { background: rgba(255,255,255,0.03); }

  .watchlist-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .watchlist-card h2 { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .watchlist-card .badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 3px 8px; border-radius: 4px; font-weight: 700;
  }
  .badge.live { background: rgba(0,212,170,0.15); color: var(--green); }
  .badge.paper { background: rgba(240,185,11,0.15); color: var(--gold); }
  .watchlist-card .updated { font-size: 11px; color: var(--muted); margin-left: auto; }

  .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; }
  .pagination button {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
  }
  .pagination button:disabled { opacity: 0.3; cursor: default; }
  .pagination .info { color: var(--muted); }

  .empty { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; }
  footer { text-align: center; color: var(--muted); font-size: 11px; padding: 20px 0; }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    header h1 { font-size: 18px; }
    .card .value { font-size: 20px; }
    th, td { padding: 8px 6px; font-size: 12px; }
    .watchlist-card h2 { flex-wrap: wrap; }
    .watchlist-card .updated { margin-left: 0; width: 100%; margin-top: 4px; }
  }
</style>
</head>
<body>
<div class="container" id="app"><div style="text-align:center;padding:60px;color:var(--muted)">Loading…</div></div>
<footer>Mitra Bot · Data refreshes daily after market close · All times ET</footer>

<script>
const FMT = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 });
const pct = v => `<span class="${v>=0?'green':'red'}">${(v>=0?'+':'')+v.toFixed(2)}%</span>`;
const fmt = v => FMT.format(v);

let DATA = null;
let PERIOD = '1M';
const PAGE_SIZE = 10;
let ledgerPage = 0;

function periodDays(p) {
  const today = new Date();
  if (p === '1D') return 1;
  if (p === '1M') return 30;
  if (p === 'YTD') {
    const start = new Date(today.getFullYear(), 0, 1);
    return Math.ceil((today - start) / 86400000) + 1;
  }
  if (p === '5Y') return 1825;
  return 30;
}

function filterHistory(history) {
  if (!history || !history.length) return [];
  const days = periodDays(PERIOD);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  return history.filter(h => new Date(h.date + 'T00:00:00') >= cutoff);
}

function drawChart() {
  const canvas = document.getElementById('mainChart');
  if (!canvas) return;
  const history = filterHistory(DATA.daily_history || []);
  if (history.length < 2) {
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#8888a0';
    ctx.font = '14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Not enough data yet', canvas.width/2, canvas.height/2);
    return;
  }

  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const pad = { top: 20, right: 20, bottom: 30, left: 60 };
  const pw = W - pad.left - pad.right, ph = H - pad.top - pad.bottom;

  const botVals = history.map(h => h.bot_total_usd).filter(v => v > 0);
  if (!botVals.length) return;
  const yMin = Math.min(...botVals) * 0.995;
  const yMax = Math.max(...botVals) * 1.005;
  const yRange = yMax - yMin || 1;

  const sx = v => pad.left + (v / (history.length - 1)) * pw;
  const sy = v => pad.top + ph - ((v - yMin) / yRange) * ph;

  // Grid
  ctx.strokeStyle = '#1e1e30'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ph * i) / 4;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#8888a0'; ctx.font = '10px system-ui'; ctx.textAlign = 'right';
    ctx.fillText(FMT.format(yMax - (yRange * i) / 4), pad.left - 8, y + 4);
  }

  // X labels
  ctx.textAlign = 'center';
  const labels = [0, Math.floor((history.length-1)/3), Math.floor(2*(history.length-1)/3), history.length-1];
  labels.forEach(i => {
    const x = sx(i);
    ctx.fillText(history[i].date.slice(5), x, H - pad.bottom + 16);
    ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, H - pad.bottom); ctx.stroke();
  });

  // Draw bot line
  ctx.beginPath(); ctx.strokeStyle = '#00d4aa'; ctx.lineWidth = 2;
  botVals.forEach((v, i) => { i === 0 ? ctx.moveTo(sx(i), sy(v)) : ctx.lineTo(sx(i), sy(v)); });
  ctx.stroke();

  // Fill bot area
  ctx.lineTo(sx(history.length-1), H - pad.bottom); ctx.lineTo(sx(0), H - pad.bottom); ctx.closePath();
  ctx.fillStyle = 'rgba(0,212,170,0.06)'; ctx.fill();
}

function renderChartCard() {
  const p = PERIOD;
  return `
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-legend">
          <span><span class="legend-dot" style="background:var(--green)"></span> Portfolio</span>
        </div>
        <div class="periods">
          ${['1D','1M','YTD','5Y'].map(pn => `<button class="${pn===p?'active':''}" onclick="setPeriod('${pn}')">${pn}</button>`).join('')}
        </div>
      </div>
      <canvas id="mainChart"></canvas>
    </div>`;
}

function renderHoldings(holdings) {
  const active = holdings.filter(h => h.status === 'open');
  if (!active.length) return '<h2>Active Holdings</h2><div class="empty">No active positions</div>';
  return `
    <h2>Active Holdings</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Symbol</th><th>Qty</th><th>Entry</th><th>Current</th><th>Mkt Value</th><th>P&L</th><th>Held</th></tr></thead>
      <tbody>${active.map(h => `
        <tr>
          <td class="symbol">${h.symbol}</td>
          <td>${h.quantity.toFixed(4)}</td>
          <td>${fmt(h.entry_price)}</td>
          <td>${fmt(h.current_price)}</td>
          <td>${fmt(h.market_value)}</td>
          <td>${pct(h.unrealized_pnl_pct)}</td>
          <td>${h.days_held||0}d</td>
        </tr>`).join('')}
      </tbody></table></div>`;
}

function renderWatchlist() {
  const watchlist = DATA.watchlist || [];
  const isLive = watchlist.length > 0 && DATA.account && DATA.account.equity_usd !== undefined;
  const badgeClass = isLive ? 'live' : 'paper';
  const badgeText = isLive ? 'Live' : 'Paper';
  if (!watchlist.length) return '<div class="watchlist-card"><h2>Watchlist <span class="badge ' + badgeClass + '">' + badgeText + '</span></h2><div class="empty">No active watchlist</div></div>';

  return `
    <div class="watchlist-card">
      <h2>Watchlist <span class="badge ${badgeClass}">${badgeText}</span><span class="updated">Updated ${DATA.updated_at||''}</span></h2>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Symbol</th><th>Strategy</th><th>Price</th><th>Entry</th><th>Stop</th><th>Target</th><th>R:R</th><th>ADV</th><th>Score</th>
        </tr></thead>
        <tbody>${watchlist.map(w => `
          <tr>
            <td class="symbol">${w.symbol}<div style="font-size:10px;color:var(--muted);font-weight:400">${w.company||''}</div></td>
            <td style="font-size:11px;color:var(--muted)">${w.strategy}</td>
            <td>${fmt(w.price)}</td>
            <td>${fmt(w.entry)}</td>
            <td>${fmt(w.stop)}</td>
            <td>${fmt(w.target)}</td>
            <td>${w.rr.toFixed(2)}</td>
            <td>${_formatADV(w.adv_usd)}</td>
            <td>${w.score.toFixed(3)}</td>
          </tr>`).join('')}
        </tbody></table></div>
    </div>`;
}

function _formatADV(value) {
  if (value >= 1_000_000_000) return '$' + (value / 1_000_000_000).toFixed(2) + 'B';
  if (value >= 1_000_000) return '$' + (value / 1_000_000).toFixed(2) + 'M';
  if (value >= 1_000) return '$' + (value / 1_000).toFixed(2) + 'K';
  return '$' + value.toFixed(2);
}

function renderLedger() {
  const trades = DATA.trade_history || [];
  if (!trades.length) return '<h2>Trade Ledger</h2><div class="empty">No closed trades yet</div>';
  const totalPages = Math.ceil(trades.length / PAGE_SIZE);
  const page = Math.min(ledgerPage, totalPages - 1);
  const slice = trades.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

  return `
    <h2>Trade Ledger</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Symbol</th><th>Entry</th><th>Exit</th><th>P&L</th><th>Held</th><th>Strategy</th></tr></thead>
      <tbody>${slice.map(t => `
        <tr>
          <td>${t.date}</td>
          <td class="symbol">${t.symbol}</td>
          <td>${fmt(t.entry_price)}</td>
          <td>${fmt(t.exit_price)}</td>
          <td>${pct(t.pnl_pct)} <span style="font-size:11px;color:var(--muted)">${fmt(t.pnl_usd)}</span></td>
          <td>${t.days_held}d</td>
          <td style="font-size:11px;color:var(--muted)">${t.strategy}</td>
        </tr>`).join('')}
      </tbody></table></div>
    <div class="pagination">
      <button ${page===0?'disabled':''} onclick="ledgerPage=Math.max(0,ledgerPage-1);render()">← Prev</button>
      <span class="info">${page+1} / ${totalPages}</span>
      <button ${page>=totalPages-1?'disabled':''} onclick="ledgerPage=Math.min(totalPages-1,ledgerPage+1);render()">Next →</button>
    </div>`;
}

function setPeriod(p) { PERIOD = p; render(); }

function render() {
  if (!DATA) return;
  const a = DATA.account || {};
  const holdings = DATA.holdings || [];
  const active = holdings.filter(h => h.status === 'open');
  const cash = a.cash_usd || 0;
  const equity = active.reduce((s, h) => s + h.market_value, 0);
  const total = cash + equity;
  const deposited = a.deposited_usd || total;
  const pnl = total - deposited;
  const pnlPct = deposited > 0 ? (pnl / deposited) * 100 : 0;

  const hist = filterHistory(DATA.daily_history || []);
  const firstBot = hist.length ? hist[0].bot_total_usd : deposited;
  const lastBot = hist.length ? hist[hist.length-1].bot_total_usd : total;
  const firstSpx = hist.length ? hist[0].spx_close : 0;
  const lastSpx = hist.length ? hist[hist.length-1].spx_close : 0;
  const botRet = firstBot > 0 ? ((lastBot - firstBot) / firstBot) * 100 : 0;
  const spxRet = firstSpx > 0 ? ((lastSpx - firstSpx) / firstSpx) * 100 : 0;

  const html = `
    <header>
      <div>
        <h1>🤖 Mitra</h1>
        <div class="status"><span class="dot${DATA.market_open?'':' off'}"></span>${DATA.market_open?'Market Open':'Market Closed'} · ${DATA.updated_at||''}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:22px;font-weight:700">${fmt(total)}</div>
        <div style="font-size:12px;color:var(--muted)">Total Portfolio</div>
      </div>
    </header>

    <div class="grid">
      <div class="card"><div class="label">Cash</div><div class="value">${fmt(cash)}</div></div>
      <div class="card"><div class="label">Invested</div><div class="value">${fmt(equity)}</div><div class="sub">${active.length} active</div></div>
      <div class="card"><div class="label">${PERIOD} Return</div><div class="value ${botRet>=0?'green':'red'}">${pct(botRet)}</div><div class="sub">SPX ${pct(spxRet)}</div></div>
      <div class="card"><div class="label">Alpha</div><div class="value ${botRet>=spxRet?'green':'red'}">${pct(botRet-spxRet)}</div><div class="sub">vs benchmark</div></div>
    </div>

    ${renderChartCard()}
    ${renderWatchlist()}
    ${renderHoldings(holdings)}
    ${renderLedger()}
  `;

  document.getElementById('app').innerHTML = html;
  setTimeout(drawChart, 50);
}

async function load() {
  try {
    const resp = await fetch('data.json');
    DATA = await resp.json();
    render();
  } catch(e) {
    document.getElementById('app').innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)">Failed to load data</div>';
  }
}

window.addEventListener('resize', () => { if (DATA) { render(); setTimeout(drawChart, 50); } });
load();
</script>
</body>
</html>
